# limbo.watch serves the site; www.limbo.watch redirects to it. One certificate covers both.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: limbowatch-site
  namespace: limbowatch
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - limbo.watch
        - www.limbo.watch
      secretName: limbowatch-tls
  rules:
    - host: limbo.watch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: limbowatch-site
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-redirect
  namespace: limbowatch
spec:
  redirectRegex:
    permanent: true
    regex: ^https?://www\.limbo\.watch/(.*)
    replacement: https://limbo.watch/${1}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: limbowatch-www-redirect
  namespace: limbowatch
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: limbowatch-www-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.limbo.watch
      secretName: limbowatch-tls
  rules:
    - host: www.limbo.watch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: limbowatch-site
                port:
                  number: 80
