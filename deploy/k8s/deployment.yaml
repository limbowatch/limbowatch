apiVersion: apps/v1
kind: Deployment
metadata:
  name: limbowatch-site
  namespace: limbowatch
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: limbowatch-site
  template:
    metadata:
      labels:
        app: limbowatch-site
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: site
          # CI (.github/workflows/site.yml) rewrites this tag to the image it just built.
          image: ghcr.io/limbowatch/limbowatch-site:20261105-42061414922
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
