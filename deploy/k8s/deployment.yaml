apiVersion: apps/v1
kind: Deployment
metadata:
  name: limbowatch-site
  namespace: limbowatch
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Zero-downtime rollouts (FINDINGS F-125): the new pod is ready, and has been for 5 s, before the old one stops,
  # and the old one keeps serving for 10 s after it's taken out of the endpoints, so Traefik never routes to a pod
  # that's gone. Without this, a deploy returned 502s and a timeout for about 6 s.
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: limbowatch-site
  template:
    metadata:
      labels:
        app: limbowatch-site
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: site
          # CI (.github/workflows/site.yml) rewrites this tag to the image it just built.
          image: ghcr.io/limbowatch/limbowatch-site:20261113-43451553424
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
