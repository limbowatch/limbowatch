# Argo CD on the k3s cluster syncs deploy/k8s. Applied once by hand:
#   kubectl apply -f deploy/argocd-app.yaml
# The cluster reads this private repo with a read-only deploy key (secret argocd/repo-limbowatch-ssh)
# and pulls the image with namespace secret limbowatch/ghcr-pull-secret. See deploy/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: limbowatch-site
  namespace: argocd
spec:
  project: default
  revisionHistoryLimit: 3
  source:
    repoURL: git@github.com:limbowatch/limbowatch.git
    targetRevision: HEAD
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: limbowatch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
