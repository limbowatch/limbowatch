# Static site. TLS ends at Traefik; this serves plain HTTP inside the cluster.
# Headers are set at server level only: an add_header inside a location would drop all of these.

# The feed and metrics are meant for tools, so any origin may fetch them.
map $uri $cors_origin {
    ~^/(feed/|metrics\.json$) "*";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # The data changes once a day.
    expires 5m;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
