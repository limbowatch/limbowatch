# Your own limbo feed, built daily by Limbowatch in your own GitLab project (docs/OWN_FEED.md).
#
# Copy this file to .gitlab-ci.yml in a project of yours (an empty one is fine), then:
#   - Build → Pipeline schedules: a daily schedule on the default branch;
#   - optional: a masked CI/CD variable LIMBOWATCH_GITHUB_TOKEN, a GitHub fine-grained token with read access to
#     public repositories. Without it GitHub allows 60 requests an hour, which fills a watchlist very slowly;
#   - optional: tracker-seeds/*.txt, your own repositories to watch (one owner/repo per line);
#   - optional: WATCH `focused` (below) to watch only your own projects' dependencies: FOCUS_GROUPS names the groups
#     (default: this project's group), and a masked CI/CD variable LIMBOWATCH_SOURCE_TOKEN reads their private
#     projects (a group access token with read_api and read_repository).
# Scans then use it with `--feed <your Pages URL>/feed/` (or LIMBOWATCH_FEED): Deploy → Pages shows the URL (a
# unique domain like https://<project>-<id>.gitlab.io for new projects). Pages' visibility follows the project's
# (Settings → General → Visibility: Pages); scans need to reach it without signing in. Or replace `public` with
# your own hosting.
#
# What it does: the tracker's state is kept in this project's package registry (a generic package,
# limbo-feed-state); each run downloads the newest copy, reads GitHub's reviewed advisories and new CVEs, polls the
# watched repositories that are due, publishes the feed (all.zip, watchlist.json, index.json, SHA256SUMS.txt and
# OSV-Scanner zips), uploads the new state and deletes all but the two newest copies. The job's own token does all
# of it, on every tier and in private projects (job artifacts can't be read back with it on GitLab Free, F-220).
# The package registry must be on (Settings → General → Visibility: Package registry).
# Everything runs in the Limbowatch image, pinned by digest; it contacts only public sources (GitHub, OSV, CVE
# Services, the Go module proxy, ecosyste.ms, Packagist, Maven Central; NVD with NVD_API_KEY), never limbo.watch.

variables:
  # The Limbowatch release this feed is built with: its image (a copy of ghcr.io/limbowatch/limbowatch, same digest)
  # and its seed lists.
  LIMBOWATCH_IMAGE: registry.gitlab.com/limbowatch/limbowatch-component:0.1.0a19@sha256:d94e96ab78b40565cc0f880517480a371b3cc4a4d1ce01b8372297a25795d156
  LIMBOWATCH_REF: v0.1.0a19
  # popular: the release's seed lists, about 67,000 repositories behind the most-used packages, like limbo.watch.
  # focused: only the source repositories of your own projects' dependencies (`limbowatch repos` over FOCUS_GROUPS,
  # refreshed each run), a few thousand at most, so runs are fast; what it can't match is in
  # docs/OWN_FEED.md#popular-or-focused.
  WATCH: popular
  FOCUS_GROUPS: $CI_PROJECT_NAMESPACE # space-separated GitLab groups, for WATCH focused
  BUDGET: "3500" # GitHub requests a run
  MAX_NEW: "2500" # repositories polled for the first time a run (more fills a new watchlist sooner)

pages:
  image:
    name: $LIMBOWATCH_IMAGE
    entrypoint: [""]
  timeout: 75m
  resource_group: limbo-feed # one run at a time: each starts from the last one's state
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      set -eu
      # the newest saved state, from this project's package registry: none on the first run
      export STATE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/limbo-feed-state/1/state.tar.gz"
      python3 - <<'PY'
      import io, os, tarfile, urllib.error, urllib.parse, urllib.request
      class SameHostToken(urllib.request.HTTPRedirectHandler):
          # a download may be redirected to object storage: the job token goes to GitLab only
          def redirect_request(self, req, fp, code, msg, headers, newurl):
              new = super().redirect_request(req, fp, code, msg, headers, newurl)
              if new is not None and urllib.parse.urlsplit(newurl).netloc != urllib.parse.urlsplit(req.full_url).netloc:
                  new.remove_header("Job-token")
              return new
      req = urllib.request.Request(os.environ["STATE_URL"], headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]})
      try:
          data = urllib.request.build_opener(SameHostToken).open(req, timeout=300).read()
      except urllib.error.HTTPError as e:
          if e.code != 404:
              raise
          print("no saved state: starting a new one")
      else:
          with tarfile.open(fileobj=io.BytesIO(data)) as t:
              files = [m for m in t.getmembers() if m.name.startswith("state/") and m.isfile()]
              t.extractall(".", members=files, filter="data")
          print(f"state: {len(files)} files, saved earlier")
      PY
      mkdir -p state
      # the seed lists of this Limbowatch release
      git clone -q --depth 1 --branch "$LIMBOWATCH_REF" --filter=blob:none --sparse \
        https://github.com/limbowatch/limbowatch.git .limbowatch
      git -C .limbowatch sparse-checkout set tracker/seeds
      set --
      if [ "$WATCH" = focused ]; then
        # your projects' dependencies' source repositories, and only those
        for g in $FOCUS_GROUPS; do set -- "$@" --gitlab-group "$g"; done
        mkdir -p focus
        limbowatch repos "$@" --out focus/repos.txt
        set -- --only-seeds --seed focus/repos.txt
      else
        for f in .limbowatch/tracker/seeds/popular-upstreams.txt .limbowatch/tracker/seeds/top100-upstreams.txt \
                 .limbowatch/tracker/seeds/top-packages.txt .limbowatch/tracker/seeds/cpp-upstreams.txt; do
          set -- "$@" --seed "$f"
        done
      fi
      for f in tracker-seeds/*.txt; do
        if [ -f "$f" ]; then set -- "$@" --seed "$f"; fi
      done
      set -- "$@" --maven-packages .limbowatch/tracker/seeds/maven-packages.txt
      # first run only: the CVE List's bulk export (about 650 MB), for CVEs that name an advisory
      if ! grep -q '"cve_bulk"' state/cursors.jsonl 2>/dev/null; then
        python3 - <<'PY'
      import json, shutil, urllib.request
      # the newest release with the bulk export: the end-of-day releases carry only a delta
      rels = json.load(urllib.request.urlopen("https://api.github.com/repos/CVEProject/cvelistV5/releases?per_page=10", timeout=60))
      asset = next(a for r in rels for a in r["assets"] if a["name"].endswith("_all_CVEs_at_midnight.zip.zip"))
      with urllib.request.urlopen(asset["browser_download_url"], timeout=1800) as r, open("/tmp/cvelist.zip.zip", "wb") as f:
          shutil.copyfileobj(r, f)
      print(f"CVE List: {asset['name']}")
      PY
        set -- "$@" --cve-list /tmp/cvelist.zip.zip
      fi
      limbowatch track --state state --budget "$BUDGET" --max-new "$MAX_NEW" --minutes 50 "$@"
      limbowatch publish --state state --out public --feed-only
      # save the state for the next run, then keep only the two newest copies
      python3 - <<'PY'
      import io, json, os, tarfile, urllib.request
      head = {"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]}
      buf = io.BytesIO()
      with tarfile.open(fileobj=buf, mode="w:gz") as t:
          t.add("state")
      urllib.request.urlopen(urllib.request.Request(os.environ["STATE_URL"], data=buf.getvalue(), headers=head,
                                                    method="PUT"), timeout=300).read()
      print(f"state saved ({len(buf.getvalue()):,} bytes)")
      api = f"{os.environ['CI_API_V4_URL']}/projects/{os.environ['CI_PROJECT_ID']}/packages"
      def get(url):
          return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=head), timeout=60))
      try:  # a failed clean-up only costs storage: the feed is still published
          pkgs = [p for p in get(f"{api}?package_type=generic&package_name=limbo-feed-state") if p["name"] == "limbo-feed-state"]
          for pkg in pkgs:
              files = [f for f in get(f"{api}/{pkg['id']}/package_files?per_page=100") if f["file_name"] == "state.tar.gz"]
              for f in sorted(files, key=lambda f: f["id"])[:-2]:
                  urllib.request.urlopen(urllib.request.Request(f"{api}/{pkg['id']}/package_files/{f['id']}",
                                                                headers=head, method="DELETE"), timeout=60).read()
      except Exception as e:
          print(f"warning: older saved states not deleted: {e}")
      PY
  artifacts:
    paths:
      - public # GitLab Pages serves this
    expire_in: 30 days
