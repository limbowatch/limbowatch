name: Limbowatch

# Daily check of this repository's dependencies for security advisories in limbo: published by their maintainers
# on GitHub, not yet in the databases Dependabot and other scanners read (https://limbo.watch).
#
# Set-up: copy this file to .github/workflows/. No secrets, no settings, no third-party actions.
# What it finds and what it can't: https://github.com/limbowatch/limbowatch/blob/main/docs/WATCHER.md#sealed-scan
#
# What can reach what:
#   collect  contents: read. GitHub's own checkout fetches only the dependency files listed below; the contents of
#            every other file never reach the runner. It downloads the feed whole (nothing about this project is
#            sent) and checks the feed and the image against their build attestations with GitHub's gh. No Limbowatch
#            code runs in this job.
#   scan     No permissions, no secrets, no repository, no token used. It runs the pinned image with no network at
#            all: read-only, no capabilities, as nobody, seeing only the dependency files and the feed. Whatever the
#            image does, nothing can leave it except the report.
#
# The price of no network: advisories reach the feed when the tracker next checks their repository (daily for
# active ones, weekly for quiet ones), and C/C++ sources taken in by git or archive, and Maven's transitive
# dependencies, are reported as not checked rather than checked. Every one is listed in the report. For same-day
# results, at the cost of the image having network: limbowatch-no-feed.yml, next to this file.
#
# Keep it standalone: only schedule and workflow_dispatch, GitHub-hosted runners, no workflow_call or workflow_run
# links to other workflows. Never restore an Actions cache in a job that holds secrets.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

env:
  # Update with each Limbowatch release: https://github.com/limbowatch/limbowatch/releases
  IMAGE: ghcr.io/limbowatch/limbowatch:0.1.0a21@sha256:375e87f103ca515d58e5f15ed320c61b8f8401646d2bb8d6e93f3c49773e3b1c
  # The feed: the limbo feed, checked against limbo.watch's build attestation. For a feed you build yourself
  # (docs/OWN_FEED.md), either set FEED_URL to where it's served (https, ending in /feed/), or set FEED_BRANCH to the
  # branch it's committed to (FEED_REPOSITORY too, if that's another repository; a private one needs a
  # LIMBO_FEED_READ_TOKEN secret, used only by the collect job). Set FEED_SIGNER to the workflow that attests it,
  # as owner/repo/.github/workflows/<file>@refs/heads/<branch>, or to "" if it isn't attested.
  FEED_URL: https://limbo.watch/feed/
  FEED_BRANCH: ""
  FEED_REPOSITORY: ""
  FEED_SIGNER: limbowatch/limbowatch/.github/workflows/site.yml@refs/heads/main

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Every file Limbowatch reads, by name, and nothing else (OSV-Scanner 2.7.1's lockfile and SBOM readers, and
      # Limbowatch's own). In most repositories that's a handful of files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            # JavaScript
            package-lock.json
            npm-shrinkwrap.json
            pnpm-lock.yaml
            yarn.lock
            bun.lock
            package.json
            # Python
            *requirements*.txt
            Pipfile.lock
            poetry.lock
            pdm.lock
            uv.lock
            pylock.toml
            pylock.*.toml
            # Go, Rust, Ruby, PHP, Elixir, Dart, R, Swift, Haskell
            go.mod
            Cargo.lock
            Cargo.toml
            Gemfile.lock
            gems.locked
            Gemfile
            composer.lock
            composer.json
            mix.lock
            pubspec.lock
            package_config.json
            renv.lock
            Package.resolved
            cabal.project.freeze
            stack.yaml.lock
            # Java and Kotlin
            pom.xml
            *.pom
            gradle.lockfile
            buildscript-gradle.lockfile
            **/gradle/verification-metadata.xml
            build.gradle
            build.gradle.kts
            # .NET
            *.csproj
            *.vbproj
            *.fsproj
            *.deps.json
            packages.config
            packages.lock.json
            Directory.Packages.props
            Directory.Build.props
            # SBOMs
            *.cdx.json
            *.cdx.xml
            bom.json
            *.spdx
            *.spdx.*
            # C and C++: sources taken in by git or archive (reported as not checked here)
            .gitmodules
            CMakeLists.txt
            *.cmake
            MODULE.bazel
            *.MODULE.bazel
            WORKSPACE
            WORKSPACE.bazel
            WORKSPACE.bzlmod
            *.bzl
            vcpkg.json
            conan.lock
            conanfile.txt
            conanfile.py
            **/subprojects/*.wrap
            # a library copied in under third_party/, vendor/ and the like: <root>/<library>/LICENSE
            **/third_party/*/[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*
            **/third_party/*/[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*
            **/third-party/*/[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*
            **/third-party/*/[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*
            **/thirdparty/*/[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*
            **/thirdparty/*/[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*
            **/3rdparty/*/[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*
            **/3rdparty/*/[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*
            **/vendor/*/[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*
            **/vendor/*/[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*
            **/vendored/*/[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*
            **/vendored/*/[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*
            **/external/*/[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*
            **/external/*/[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*
            **/extern/*/[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*
            **/extern/*/[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*
            **/deps/*/[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*
            **/deps/*/[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*
            **/contrib/*/[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*
            **/contrib/*/[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*
            # never inside installed packages
            !**/node_modules/**
      # The checked-out files (git marks them H; the rest are S, skipped), copied without .git: exactly what leaves
      # this job, listed in the log and the job summary.
      - name: Copy out the dependency files
        run: |
          mkdir deps
          git -C src ls-files -z -t | sed -z -n 's/^H //p' | (cd src && xargs -0 -r cp -P --parents -t ../deps --)
          (cd deps && find . \( -type f -o -type l \) | sort) | tee files.txt
          { echo "**$(grep -c . files.txt) dependency files scanned**"; echo; sed 's/^\.\//- /' files.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check out the feed branch
        if: env.FEED_BRANCH != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FEED_REPOSITORY || github.repository }}
          ref: ${{ env.FEED_BRANCH }}
          path: feed-branch
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /feed/all.zip
            /feed/watchlist.json
          token: ${{ secrets.LIMBO_FEED_READ_TOKEN || github.token }}
      # The feed is downloaded whole: nothing about this project is sent. Then gh checks it against its build
      # attestation: built by FEED_SIGNER's workflow, and all.zip and watchlist.json from the same build.
      - name: Get the feed and check its build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir feed
          if [ -n "$FEED_BRANCH" ]; then
            cp feed-branch/feed/all.zip feed-branch/feed/watchlist.json feed/
            from="branch ${FEED_REPOSITORY:-$GITHUB_REPOSITORY}@$FEED_BRANCH"
          else
            case "$FEED_URL" in https://*/) ;; *) echo "::error::FEED_URL must be an https:// URL ending in /"; exit 1 ;; esac
            for f in all.zip watchlist.json; do
              curl -fsS --proto '=https' --tlsv1.2 --retry 3 --max-filesize 200000000 -o "feed/$f" "$FEED_URL$f"
            done
            from="$FEED_URL"
          fi
          if [ -n "$FEED_SIGNER" ]; then
            workflow="${FEED_SIGNER%@*}"
            args=(--repo "$(echo "$workflow" | cut -d/ -f1-2)" --signer-workflow "$workflow")
            case "$FEED_SIGNER" in *@*) args+=(--source-ref "${FEED_SIGNER#*@}") ;; esac
            gh attestation verify feed/all.zip "${args[@]}" --format json > feed-attestation.json \
              || { echo "::error::the feed isn't attested by $FEED_SIGNER (FEED_SIGNER)"; exit 1; }
            jq -e --arg z "$(sha256sum feed/all.zip | cut -d' ' -f1)" --arg w "$(sha256sum feed/watchlist.json | cut -d' ' -f1)" \
              'any(.[]; [.verificationResult.statement.subject[].digest.sha256] | (index($z) != null and index($w) != null))' \
              feed-attestation.json > /dev/null || { echo "::error::all.zip and watchlist.json aren't from the same build"; exit 1; }
            echo "Feed: $from, attested by \`$FEED_SIGNER\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Limbowatch::the feed from $from isn't checked against a build attestation (FEED_SIGNER is empty)"
            echo "Feed: $from, **not checked against a build attestation**" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check the image's build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://$IMAGE" --repo limbowatch/limbowatch \
            --signer-workflow limbowatch/limbowatch/.github/workflows/image.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-files
          path: deps
          include-hidden-files: true  # .gitmodules; deps has no .git
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed
          path: feed
          if-no-files-found: error
          retention-days: 1

  scan:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-files
          path: in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feed
          path: feed
      # Exit codes: 0 nothing at or above fail-on, 1 findings at or above it, 2 the scan couldn't run.
      - name: Scan, with no network
        run: |
          mkdir -m 777 out
          docker pull --quiet "$IMAGE"   # the digest collect checked
          # Workflow commands are off while the image prints; the token is random and the image never sees it.
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::$token"
          rc=0
          docker run --rm --network none --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --pids-limit 256 --memory 2g -e HOME=/tmp \
            -v "$PWD/in:/scan:ro" -v "$PWD/feed:/feed:ro" -v "$PWD/out:/out" \
            "$IMAGE" \
            limbowatch scan /scan --feed /feed --no-upstream --no-resolve-maven --no-osv-commits \
              --fail-on high \
              -o json=/out/report.json -o markdown=/out/report.md -o html=/out/report.html -o sarif=/out/report.sarif || rc=$?
          echo "::$token::"
          # Only regular files leave out/: a symlink the image made there could point at any file on the runner.
          find out -mindepth 1 ! -type f ! -type d -delete
          exit "$rc"
      # Also when the scan found something (exit 1), so the findings are shown and kept.
      - name: Job summary
        if: ${{ !cancelled() && hashFiles('out/report.md') != '' }}
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('out/report.json') != '' }}
        with:
          name: limbowatch-report
          path: out
          if-no-files-found: error
          retention-days: 30

  # To post to Slack or open tickets, add a third job with `needs: scan` that downloads limbowatch-report and holds
  # the secret. Treat the report as untrusted input there: parse it with jq, send only fields you checked (counts,
  # GHSA IDs, package names, paths that exist in dependency-files), and never put its values into ${{ }}
  # expressions, GITHUB_ENV or GITHUB_OUTPUT.
