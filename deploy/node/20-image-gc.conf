# Kubelet image garbage collection for the k3s nodes (skylion, skycat).
# Every site deploy pushes a new ghcr.io/limbowatch/limbowatch-site tag, so old images pile up on disk.
#
# This is node config, not a cluster resource: it lives outside deploy/k8s so Argo CD never tries to apply it.
# Install it by hand on each node (deploy/README.md, "Node config"):
#   install -D -m 0644 20-image-gc.conf /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/20-image-gc.conf
#   systemctl restart k3s        # skylion (server); on skycat (agent): systemctl restart k3s-agent
#
# imageMaximumGCAge needs Kubernetes 1.30 or later (beta there, on by default).
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# Start removing unused images when the image disk is 75% full, and stop at 65%.
imageGCHighThresholdPercent: 75
imageGCLowThresholdPercent: 65
# Also remove any image that has been unused for 14 days, however much disk is free.
imageMaximumGCAge: 336h
