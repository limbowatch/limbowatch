[project]
name = "limbowatch-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/core", "packages/cli"]

[tool.uv.sources]
limbowatch = { workspace = true }
limbowatch-cli = { workspace = true }

[dependency-groups]
dev = [
    "limbowatch",
    "limbowatch-cli",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.21",
    "jsonschema>=4.23",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "import-linter>=2.1",
    "pyyaml>=6",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"packages/core/src/limbowatch/publish/site.py" = ["E501"]  # embedded HTML/CSS/JS template
"packages/core/src/limbowatch/watch/output.py" = ["E501"]  # report templates (HTML, Markdown, XML)

[tool.mypy]
strict = true
python_version = "3.12"
files = ["packages/core/src", "packages/cli/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["univers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_packages = ["limbowatch", "limbowatch_cli"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core never imports the CLI"
type = "forbidden"
source_modules = ["limbowatch"]
forbidden_modules = ["limbowatch_cli"]

[[tool.importlinter.contracts]]
name = "Pure modules do no I/O"
type = "forbidden"
source_modules = ["limbowatch.versions", "limbowatch.classify", "limbowatch.normalize", "limbowatch.ecosystems", "limbowatch.models", "limbowatch.schedule", "limbowatch.csvsafe", "limbowatch.watch.output"]
forbidden_modules = ["httpx", "sqlalchemy", "limbowatch.http", "limbowatch.store", "limbowatch.sources"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Sources fetch, never classify"
type = "forbidden"
source_modules = ["limbowatch.sources"]
forbidden_modules = ["limbowatch.classify", "limbowatch.store", "limbowatch.tracker", "limbowatch.publish"]
