# Builds the public site from the latest tracker state and uploads it to the R2 bucket that serves limbo.watch
# (docs/HOSTING_PLAN.md, deploy/README.md).
# - Runs after each successful tracker run, when site code changes, or by hand.
# - Only changed files are uploaded; the upload refuses to delete more than 2% of the bucket.
name: site
on:
  workflow_run:
    workflows: [tracker]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "packages/core/src/limbowatch/publish/**"
      - "packages/cli/src/limbowatch_cli/**"
      - "brand/assets/**"
      - "docs/screenshots/**"
      - "deploy/cloudflare/requirements.txt"
      - "scripts/sync_r2.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Holds the R2 upload credentials; only main may deploy to it (docs/HOSTING_PLAN.md, "Credentials").
    environment: site
    # Signs build provenance for the feed files (F-191): id-token mints the Sigstore certificate, attestations
    # stores the attestation, artifact-metadata its record.
    # actions: read fetches the showcase workflow's artifact (the popular projects' dependencies, F-203).
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Check out tracker-data
        run: git clone -q --depth 1 --branch tracker-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" tracker-data
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # Unchanged records keep the live feed's `modified` (FINDINGS F-174). If it can't be fetched, publish warns and
      # every record's `modified` is the build time.
      # Its dates are only borrowed if our own attestation vouches for the file (F-193): a swapped copy is ignored.
      - name: Previous feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$RUNNER_TEMP/previous-all.zip"
          curl -fsSL --retry 3 --max-time 120 -o "$prev" https://limbo.watch/feed/all.zip || rm -f "$prev"
          if [ -f "$prev" ] && ! gh attestation verify "$prev" --repo "${{ github.repository }}" \
               --signer-workflow "${{ github.repository }}/.github/workflows/site.yml" \
               --source-ref refs/heads/main --deny-self-hosted-runners > /dev/null; then
            echo "::warning title=site::the live feed/all.zip didn't verify; every record's modified is the build time"
            rm -f "$prev"
          fi
      # The popular projects' dependencies from the latest successful showcase run on main. Without them the home page
      # shows the proof repository instead.
      - name: Showcase
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "${{ github.repository }}" --workflow showcase.yml --branch main --status success \
                --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$run" ] && gh run download "$run" -R "${{ github.repository }}" -n showcase -D "$RUNNER_TEMP/showcase"; then
            echo "showcase: run $run"
          else
            echo "::warning title=site::no showcase artifact; the home page shows the proof repository"
          fi
      - name: Publish
        env:
          LIMBOWATCH_GA_ID: ${{ vars.LIMBOWATCH_GA_ID }}  # repository variable; empty means no analytics
        run: |
          extra=()
          if [ -f "$RUNNER_TEMP/showcase/showcase.json" ]; then extra=(--showcase "$RUNNER_TEMP/showcase/showcase.json"); fi
          uv run limbowatch publish --state tracker-data/state --out "$RUNNER_TEMP/site" \
            --previous-feed "$RUNNER_TEMP/previous-all.zip" "${extra[@]}"
      # Anyone can check that a downloaded feed file is exactly what this workflow built from main, independently of
      # limbo.watch and Cloudflare: gh attestation verify <file> --repo limbowatch/limbowatch (docs/WATCHER.md).
      - name: Attest the feed
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/site/feed/all.zip
            ${{ runner.temp }}/site/feed/watchlist.json
            ${{ runner.temp }}/site/feed/index.json
            ${{ runner.temp }}/site/feed/SHA256SUMS.txt
            ${{ runner.temp }}/site/osv/SHA256SUMS.txt
            ${{ runner.temp }}/site/osv/limbo-db.zip
            ${{ runner.temp }}/site/osv/*/all.zip
      - name: Upload to R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # `uv run --with-requirements` doesn't check hashes; `uv pip install --require-hashes` does (F-182)
          uv venv -q "$RUNNER_TEMP/r2"
          uv pip install -q --python "$RUNNER_TEMP/r2/bin/python" --require-hashes -r deploy/cloudflare/requirements.txt
          "$RUNNER_TEMP/r2/bin/python" scripts/sync_r2.py "$RUNNER_TEMP/site"
