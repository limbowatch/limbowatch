# Builds the public site from the latest tracker state and uploads it to the R2 bucket that serves limbo.watch
# (docs/HOSTING_PLAN.md, deploy/README.md).
# - Runs after each successful tracker run, when site code changes, or by hand.
# - Only changed files are uploaded; the upload refuses to delete more than 2% of the bucket.
name: site
on:
  workflow_run:
    workflows: [tracker]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "packages/core/src/limbowatch/publish/**"
      - "packages/cli/src/limbowatch_cli/**"
      - "brand/assets/**"
      - "docs/screenshots/**"
      - "deploy/cloudflare/requirements.txt"
      - "scripts/sync_r2.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Holds the R2 upload credentials; only main may deploy to it (docs/HOSTING_PLAN.md, "Credentials").
    environment: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Check out tracker-data
        run: git clone -q --depth 1 --branch tracker-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" tracker-data
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # Unchanged records keep the live feed's `modified` (FINDINGS F-174). If it can't be fetched, publish warns and
      # every record's `modified` is the build time.
      - name: Previous feed
        run: curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/previous-all.zip" https://limbo.watch/feed/all.zip || true
      - name: Publish
        env:
          LIMBOWATCH_GA_ID: ${{ vars.LIMBOWATCH_GA_ID }}  # repository variable; empty means no analytics
        run: |
          uv run limbowatch publish --state tracker-data/state --out "$RUNNER_TEMP/site" \
            --previous-feed "$RUNNER_TEMP/previous-all.zip"
      - name: Upload to R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # `uv run --with-requirements` doesn't check hashes; `uv pip install --require-hashes` does (F-182)
          uv venv -q "$RUNNER_TEMP/r2"
          uv pip install -q --python "$RUNNER_TEMP/r2/bin/python" --require-hashes -r deploy/cloudflare/requirements.txt
          "$RUNNER_TEMP/r2/bin/python" scripts/sync_r2.py "$RUNNER_TEMP/site"
