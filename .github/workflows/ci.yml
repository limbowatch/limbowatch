name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: Lint, types, module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check packages tests
      - run: uv run ruff format --check packages tests
      - run: uv run mypy
      - run: uv run lint-imports

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -q --cov --cov-report=term   # recorded fixtures only; no network; fails below 90% coverage

  package:
    name: Build and install the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --package limbowatch --out-dir dist/core && uv build --package limbowatch-cli --out-dir dist/cli
      - name: Metadata renders on PyPI
        run: uvx twine check --strict dist/core/* dist/cli/*
      - name: The wheels install into a clean environment and run
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/core/*.whl dist/cli/*.whl
          want=$(uv run python -c "import tomllib;print(tomllib.load(open('packages/cli/pyproject.toml','rb'))['project']['version'])")
          got=$(/tmp/smoke/bin/limbowatch --version)
          [ "$got" = "limbowatch $want" ] || { echo "version: got '$got', want 'limbowatch $want'"; exit 1; }
          /tmp/smoke/bin/limbowatch scan --help > /dev/null
