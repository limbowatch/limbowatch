name: dependabot-action-requirements
# Dependabot bumps uv.lock but not integrations/action/requirements.txt, which must match it (the action's
# `install: python` pins every package with hashes; tests/test_integrations.py checks the two agree). On a Dependabot
# pull request that touches uv.lock, regenerate the file with scripts/action_requirements.py and push it to the branch.
#
# The push uses a GitHub App installation token, not GITHUB_TOKEN: a GITHUB_TOKEN push leaves the pull request's runs
# waiting for approval, and a dispatched ci run doesn't show on the pull request (FINDINGS F-230, F-232). Workflows
# that Dependabot triggers see only Dependabot secrets, so the App's credentials are Dependabot secrets:
#   LIMBOWATCH_BOT_CLIENT_ID    the App's client ID
#   LIMBOWATCH_BOT_PRIVATE_KEY  a private key of the App
# The App needs only "Contents: read and write" on this repository. Its push starts this workflow once more, which then
# finds nothing to change.
on:
  pull_request:
    paths: [uv.lock]
permissions:
  contents: read
concurrency:
  group: dependabot-action-requirements-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    # Only pull requests Dependabot opened, from a branch in this repository (never a fork). The PR author, not
    # github.actor: the actor is whoever caused this event, and can be Dependabot on someone else's pull request.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false   # the App token is handed to `git push` only, after the script has run
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Regenerate integrations/action/requirements.txt
        id: regen
        run: |
          python3 scripts/action_requirements.py   # stdlib only; uv export --frozen and uv pip compile (PyPI)
          if git diff --quiet -- integrations/action/requirements.txt; then
            echo "requirements.txt already matches uv.lock"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the App's Dependabot secrets
        if: steps.regen.outputs.changed == 'true'
        env:
          CLIENT_ID: ${{ secrets.LIMBOWATCH_BOT_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Dependabot secret LIMBOWATCH_BOT_CLIENT_ID is not set; see the header of this workflow. Run scripts/action_requirements.py and push by hand."
            exit 1
          fi
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        if: steps.regen.outputs.changed == 'true'
        id: app
        with:
          client-id: ${{ secrets.LIMBOWATCH_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LIMBOWATCH_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit and push
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BRANCH: ${{ github.head_ref }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -q -m "build(action): regenerate pinned requirements for uv.lock" \
            -m "Generated by scripts/action_requirements.py (.github/workflows/dependabot-action-requirements.yml)." \
            -- integrations/action/requirements.txt
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/$BRANCH"
