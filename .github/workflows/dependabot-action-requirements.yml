name: dependabot-action-requirements
# Dependabot bumps uv.lock but not integrations/action/requirements.txt, which must match it (the action's
# `install: python` pins every package with hashes; tests/test_integrations.py checks the two agree). On a Dependabot
# pull request that touches uv.lock, regenerate the file with scripts/action_requirements.py and push it to the branch.
#
# A push made with GITHUB_TOKEN starts no new pull_request or push runs, but workflow_dispatch is exempt, so the job
# then dispatches `ci` on the branch to test the new head commit. Dependabot runs get a read-only token and only
# Dependabot secrets; the permissions below raise this token for this job alone.
on:
  pull_request:
    paths: [uv.lock]
permissions:
  contents: read
concurrency:
  group: dependabot-action-requirements-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    # Only pull requests Dependabot opened, from a branch in this repository (never a fork). The PR author, not
    # github.actor: the actor is whoever caused this event, and can be Dependabot on someone else's pull request.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the regenerated file to the Dependabot branch
      actions: write    # dispatch ci on that branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false   # the token is handed to `git push` only, not left in .git/config for the script
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Regenerate integrations/action/requirements.txt
        run: python3 scripts/action_requirements.py   # stdlib only; uv export --frozen and uv pip compile (PyPI)
      - name: Commit, push and test the new head
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- integrations/action/requirements.txt; then
            echo "requirements.txt already matches uv.lock"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "build(action): regenerate pinned requirements for uv.lock" \
            -m "Generated by scripts/action_requirements.py (.github/workflows/dependabot-action-requirements.yml)." \
            -- integrations/action/requirements.txt
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:refs/heads/$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
