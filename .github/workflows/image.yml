name: image
# The watcher image, ghcr.io/limbowatch/limbowatch (Dockerfile), for linux/amd64 and linux/arm64:
# - pull requests: build and smoke-test, nothing pushed;
# - main: `edge` and `sha-<commit>`;
# - a v* tag: no new build. The release commit pins a digest built from main in integrations/action/action.yml and
#   the GitLab component; that exact image gets the version tag (e.g. `0.1.0a3`), and `latest` for final releases.
#   What was tested is what ships.
# Every built image carries an SBOM and BuildKit provenance, plus a GitHub build attestation:
#   gh attestation verify oci://ghcr.io/limbowatch/limbowatch:<tag> --owner limbowatch
# The GitLab component copies a release's image by digest to its own registry (integrations/gitlab/.gitlab-ci.yml).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [Dockerfile, .dockerignore, pyproject.toml, uv.lock, "packages/**", .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, uv.lock, "packages/**", .github/workflows/image.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/limbowatch/limbowatch
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.ref_type == 'tag'
        name: Tag the image the release pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref=$(sed -n 's|^ *default: \(ghcr\.io/limbowatch/limbowatch:[^ ]*\)$|\1|p' integrations/action/action.yml)
          ver=${GITHUB_REF_NAME#v}; digest=${ref#*@}
          [ "${ref%@*}" = "$IMAGE:$ver" ] || { echo "action.yml pins $ref, not $IMAGE:$ver@sha256:…"; exit 1; }
          grep -q "registry.gitlab.com/limbowatch/limbowatch-component:$ver@$digest" integrations/gitlab/templates/limbowatch.yml \
            || { echo "the GitLab component doesn't pin the same image"; exit 1; }
          [ "$(docker run --rm "$IMAGE@$digest" limbowatch --version)" = "limbowatch $ver" ]
          gh attestation verify "oci://$IMAGE@$digest" --owner limbowatch >/dev/null
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags=(-t "$IMAGE:$ver")
          case "$ver" in *a*|*b*|*rc*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$digest"
          echo "### $IMAGE:$ver → $digest" >> "$GITHUB_STEP_SUMMARY"
      - if: github.ref_type != 'tag'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: github.ref_type != 'tag'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.ref_type != 'tag'
        name: Build for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: limbowatch:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.ref_type != 'tag'
        name: Smoke test
        run: |
          docker run --rm limbowatch:test sh -c 'limbowatch --version && osv-scanner --version && limbowatch scan --help >/dev/null'
          # exit codes are a contract: 2 when the scan can't run
          rc=0; docker run --rm limbowatch:test limbowatch scan /nonexistent || rc=$?
          [ "$rc" = 2 ] || { echo "expected exit 2, got $rc"; exit 1; }
      - if: github.ref_type != 'tag'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
      - if: github.event_name != 'pull_request' && github.ref_type != 'tag'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref_type != 'tag'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name != 'pull_request' && github.ref_type != 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - if: github.event_name != 'pull_request' && github.ref_type != 'tag'
        name: Summary
        run: |
          {
            echo "### ${IMAGE}@${DIGEST}"
            echo
            echo "Tags: $(echo "$TAGS" | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
