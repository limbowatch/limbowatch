name: image
# The watcher image, ghcr.io/limbowatch/limbowatch (Dockerfile), for linux/amd64 and linux/arm64:
# - pull requests: build and smoke-test, nothing pushed;
# - main: `edge` and `sha-<commit>`;
# - a v* tag: the version (e.g. `0.1.0a2`), and `latest` for final releases only.
# Every pushed image carries an SBOM and BuildKit provenance, plus a GitHub build attestation:
#   gh attestation verify oci://ghcr.io/limbowatch/limbowatch:<tag> --owner limbowatch
# The GitLab component copies a release's image by digest to its own registry (integrations/gitlab/.gitlab-ci.yml).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [Dockerfile, .dockerignore, pyproject.toml, uv.lock, "packages/**", .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, uv.lock, "packages/**", .github/workflows/image.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/limbowatch/limbowatch
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # build attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: limbowatch:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm limbowatch:test sh -c 'limbowatch --version && osv-scanner --version && limbowatch scan --help >/dev/null'
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$(docker run --rm limbowatch:test limbowatch --version)" = "limbowatch ${GITHUB_REF_NAME#v}" ]
          fi
          # exit codes are a contract: 2 when the scan can't run
          rc=0; docker run --rm limbowatch:test limbowatch scan /nonexistent || rc=$?
          [ "$rc" = 2 ] || { echo "expected exit 2, got $rc"; exit 1; }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=pep440,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') }}
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - if: github.event_name != 'pull_request'
        name: Summary
        run: |
          {
            echo "### ${IMAGE}@${DIGEST}"
            echo
            echo "Tags: $(echo "$TAGS" | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
