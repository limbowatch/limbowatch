# Daily Limbo Tracker run. State lives on the `tracker-data` branch (JSONL, factual fields only);
# the site and feed are deployed to GitHub Pages. Disabled until the repo goes public (see tracker/README.md).
name: tracker
on:
  # Enable the daily schedule once the repo is public (Pages on a private repo needs a paid plan):
  # schedule:
  #   - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      budget:
        description: "Max GitHub requests this run (blank: 3500 with a PAT, 900 with GITHUB_TOKEN)"
        default: ""
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: tracker-data
          path: tracker-data
        continue-on-error: true   # first run: the branch doesn't exist yet
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Track
        env:
          # A fine-grained PAT (public repos, read-only) keeps ETags valid across runs (FINDINGS F-058).
          # Falls back to the per-run GITHUB_TOKEN (1,000 requests/hour).
          PAT: ${{ secrets.LIMBOWATCH_GITHUB_TOKEN }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          BUDGET_INPUT: ${{ inputs.budget }}
        run: |
          if [ -n "$PAT" ]; then export LIMBOWATCH_GITHUB_TOKEN="$PAT"; budget=3500
          else export LIMBOWATCH_GITHUB_TOKEN="$ACTIONS_TOKEN"; budget=900; fi
          mkdir -p tracker-data/state
          uv run limbowatch track --state tracker-data/state --seed tracker/seeds/popular-upstreams.txt \
            --budget "${BUDGET_INPUT:-$budget}" --minutes 50
      - name: Publish
        run: uv run limbowatch publish --state tracker-data/state --out site
      - name: Save state
        working-directory: tracker-data
        run: |
          git init -q 2>/dev/null || true
          git checkout -q -B tracker-data
          git add state
          git -c user.name="limbowatch-bot" -c user.email="bot@limbo.watch" commit -q -m "tracker state $(date -u +%F)" || exit 0
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" tracker-data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: track
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
