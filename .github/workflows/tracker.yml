# Daily Limbo Tracker run and report.
# - State (JSONL, factual fields only) and daily reports live on the `tracker-data` branch.
# - The report is posted as a comment on the "Limbo Tracker daily report" issue (watchers get an
#   email) and shown in the run summary.
# - The public site is rebuilt from this state by .github/workflows/site.yml when this run succeeds.
name: tracker
on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      budget:
        description: "Max GitHub requests this run (blank: 3500 with a PAT, 900 with GITHUB_TOKEN)"
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Check out tracker-data
        run: |
          if git ls-remote --exit-code --heads origin tracker-data >/dev/null; then
            git clone -q --depth 1 --branch tracker-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" tracker-data
          else
            mkdir -p tracker-data && git -C tracker-data init -q -b tracker-data
          fi
          mkdir -p tracker-data/state tracker-data/reports
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: CVE List bootstrap (first run only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! grep -q '"cve_bulk"' tracker-data/state/cursors.jsonl 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/cvelist"
            gh release download --repo CVEProject/cvelistV5 --pattern '*_all_CVEs_at_midnight.zip.zip' --dir "$RUNNER_TEMP/cvelist"
            echo "CVE_LIST=$(ls "$RUNNER_TEMP"/cvelist/*.zip.zip)" >> "$GITHUB_ENV"
          fi
      - name: Track
        env:
          # A fine-grained PAT (public repositories, read-only) keeps ETags valid across runs
          # (FINDINGS F-058). Without it, the per-run GITHUB_TOKEN allows 1,000 requests/hour.
          PAT: ${{ secrets.LIMBOWATCH_GITHUB_TOKEN }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          BUDGET_INPUT: ${{ inputs.budget }}
        run: |
          if [ -n "$PAT" ]; then export LIMBOWATCH_GITHUB_TOKEN="$PAT"; budget=3500
          else export LIMBOWATCH_GITHUB_TOKEN="$ACTIONS_TOKEN"; budget=900; fi
          extra=""; [ -n "${CVE_LIST:-}" ] && extra="--cve-list $CVE_LIST"
          uv run limbowatch track --state tracker-data/state --seed tracker/seeds/popular-upstreams.txt \
            --seed tracker/seeds/top100-upstreams.txt \
            --budget "${BUDGET_INPUT:-$budget}" --minutes 50 --max-nvd 40 $extra
      - name: Report
        id: report
        run: |
          path=$(uv run limbowatch report --state tracker-data/state --out tracker-data/reports)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          cat "$path" >> "$GITHUB_STEP_SUMMARY"
      - name: Save state and report
        working-directory: tracker-data
        run: |
          git add state reports
          git -c user.name="limbowatch-bot" -c user.email="bot@limbo.watch" commit -q -m "tracker $(date -u +%F)" || exit 0
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" tracker-data
      - name: Post report to the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.report.outputs.path }}
        run: |
          title="Limbo Tracker daily report"
          n=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            n=$(gh issue create --repo "${{ github.repository }}" --title "$title" \
              --body "Each daily Limbo Tracker run posts its report here. Subscribe to this issue to get it by email. Reports are also kept on the \`tracker-data\` branch under \`reports/\`." \
              | grep -o '[0-9]*$')
          fi
          head -c 65000 "$REPORT" > "$RUNNER_TEMP/comment.md"
          gh issue comment "$n" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/comment.md"
