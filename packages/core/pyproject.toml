[project]
name = "limbowatch"
version = "0.1.0"
description = "Track published security advisories stuck in limbo (not yet reviewed into the databases scanners read)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "univers>=30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limbowatch"]
