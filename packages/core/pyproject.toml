[project]
name = "limbowatch"
version = "0.1.0a12"
description = "Track published security advisories stuck in limbo (not yet reviewed into the databases scanners read)"
license = "Apache-2.0"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Limbowatch contributors" }]
keywords = ["security", "advisories", "vulnerabilities", "ghsa", "osv", "sca", "dependencies", "supply-chain", "sarif", "cyclonedx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.14.2",
    "sqlalchemy>=2.0",
    "univers>=30",
]

[project.urls]
Homepage = "https://limbo.watch"
Source = "https://github.com/limbowatch/limbowatch"
Documentation = "https://github.com/limbowatch/limbowatch/blob/main/docs/WATCHER.md"
Issues = "https://github.com/limbowatch/limbowatch/issues"
Changelog = "https://github.com/limbowatch/limbowatch/blob/main/CHANGELOG.md"
Tracker = "https://limbo.watch/tracker/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limbowatch"]
