[project]
name = "limbowatch-cli"
version = "0.1.0a14"
description = "Find dependencies affected by security advisories not yet in GitHub's reviewed database or OSV"
license = "Apache-2.0"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Limbowatch contributors" }]
keywords = ["security", "advisories", "vulnerabilities", "ghsa", "osv", "sca", "dependencies", "supply-chain", "sarif", "cyclonedx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["limbowatch==0.1.0a14", "typer>=0.12"]

[project.scripts]
limbowatch = "limbowatch_cli.main:main"

[project.urls]
Homepage = "https://limbo.watch"
Source = "https://github.com/limbowatch/limbowatch"
Documentation = "https://github.com/limbowatch/limbowatch/blob/main/docs/WATCHER.md"
Issues = "https://github.com/limbowatch/limbowatch/issues"
Changelog = "https://github.com/limbowatch/limbowatch/blob/main/CHANGELOG.md"
Tracker = "https://limbo.watch/tracker/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limbowatch_cli"]
