[project]
name = "limbowatch-cli"
version = "0.1.0"
description = "Limbowatch command line"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["limbowatch", "typer>=0.12"]

[project.scripts]
limbowatch = "limbowatch_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limbowatch_cli"]
